name: Deploy static demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static checks and tests
        run: |
          npm run check
          npm run test:billing
          for f in apps/web/app.js apps/web/api.js apps/web/wallets.js apps/web/networks.js; do node --check "$f"; done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp -R apps/web/. dist/
          cp -R docs dist/docs
          # Cache-busting: replace manual ?v= stamps with the commit hash
          find dist -maxdepth 1 -name '*.html' -exec sed -i -E "s/\?v=[0-9A-Za-z-]+/?v=${GITHUB_SHA::8}/g" {} +

      - name: Upload static demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
